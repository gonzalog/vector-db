services:
  vector-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vector-db-api
    ports:
      - "8000:8000"
    environment:
      # API Configuration
      - PROJECT_NAME=Vector DB API
      - VERSION=0.1.0
      - API_V1_PREFIX=/api/v1
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development

      # CORS Settings
      - BACKEND_CORS_ORIGINS=*

      # Logging
      - LOG_LEVEL=DEBUG
      - DEBUG=true

      # API Keys (override with .env file)
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

    volumes:
      # Persist database and data
      - ./data:/app/data
      # Mount source code for hot-reload
      - ./src:/app/src

    command: ["uvicorn", "vector_db.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
