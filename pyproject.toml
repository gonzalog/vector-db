[project]
name = "vector-db"
version = "0.1.0"
description = "A high-performance REST API for indexing and querying documents in a Vector Database, implementing custom vector indexing algorithms from scratch."
readme = "README.md"
authors = [
    { email = "gonzalogarcia93@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.21.0",
    "cohere>=5.20.0",
    "datasets>=4.3.0",
    "fastapi>=0.120.3",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
cohere = [
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"
